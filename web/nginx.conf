server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Never cache the HTML entrypoint: a prior Vite HTML/JS pair must not
  # survive a deployment and silently hide newly shipped MAIRA workflows.
  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files /index.html =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }
  # Hashed Vite assets can be cached indefinitely without mixing versions.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
